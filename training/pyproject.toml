[project]
name = "ttrally-training"
version = "0.1.0"
description = "Backbone export and training of the ttrally rally detection model"
requires-python = ">=3.11,<3.14"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.5",
    "torch>=2.5",
    "transformers>=4.46",
    # listed so that it comes from the ROCm index like the torch build that needs it
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# On Linux x86_64 the ROCm build of PyTorch trains on AMD GPUs (e.g. the RX 7800 XT) and falls
# back to the CPU without one; elsewhere the CPU build is enough.
[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
